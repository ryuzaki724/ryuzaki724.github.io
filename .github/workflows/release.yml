name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AAAD0C: ${{ secrets.AAAD0C }}
          B8137E: ${{ secrets.B8137E }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AAAD0C', '')
          k2 = os.environ.get('B8137E', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- cc7dbae1b2b4eff328ba53318ea400cf756bb2f0e2 -->', k1) if k1 else txt
          out = out.replace('<!-- a87a72c722aa1761969330f461b1 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
